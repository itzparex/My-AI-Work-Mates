*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}

main{max-width:1240px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blush);font-weight:800}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3vw,32px);line-height:1.1;margin:4px 0 6px;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-size:17px;margin:0 0 10px}
.sub{color:var(--muted);margin:0;max-width:66ch}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn:disabled:hover{border-color:var(--line);color:inherit}.btn.primary:disabled:hover{border-color:var(--accent);color:var(--accent-ink);filter:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.card ul{margin:0;padding-left:18px}.card li{margin:3px 0}

.kpi:hover{border-color:var(--accent)}
.kpi .n{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1}.kpi .l{font-weight:700;margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.toolbar input{flex:1;min-width:180px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td a{color:var(--accent);word-break:break-all}
.mono{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{display:inline-flex;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.g{background:var(--good-soft);color:var(--good)}.a{background:var(--accent-soft);color:var(--accent)}.w{background:var(--warn-soft);color:var(--warn)}.b{background:var(--bad-soft);color:var(--bad)}.p{background:var(--blush-soft);color:var(--blush)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}

.formacts{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}

.note{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px;margin-top:14px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.form.plain{border:0;padding:0;margin:0;background:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.kq{padding:10px 0;border-top:1px solid var(--line)}.kq label{display:flex;gap:10px;font-weight:700;margin-bottom:6px}
.kq textarea,.qgrid textarea,.qgrid input,.qcard input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:11.5px;font-weight:800}
table.mini th{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--muted);padding:6px 8px 6px 0;width:42%}table.mini td{padding:6px 0;font-weight:700}
.mk{padding:10px 0;border-top:1px solid var(--line)}.mk:first-of-type{border-top:0;padding-top:0}
.mk dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:6px 0 0;font-size:12.5px}.mk dt{color:var(--muted);font-weight:700}.mk dd{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:700;cursor:pointer;font-size:12.5px}.seg button.on{background:var(--accent);color:var(--accent-ink)}
.qcard{margin-bottom:10px}.look{margin:6px 0 10px;font-size:12.5px;color:var(--muted)}.look span{font-weight:700;color:var(--ink)}
.qgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
.qgrid [data-bad]{color:var(--warn)}
.qgrid.igrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.unk{display:inline-flex;gap:8px;align-items:center;margin-top:8px;font-size:12.5px;font-weight:700;cursor:pointer}.unk input{accent-color:var(--accent);width:16px;height:16px}
.card a,.note a,.sub a{color:var(--accent)}
a.btn{text-decoration:none;display:inline-block;color:var(--ink);word-break:normal}a.btn.primary{color:var(--accent-ink)}
.evin{display:flex;gap:6px;align-items:center}.evin input{flex:1;min-width:0}
.evchips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.evchips:empty{display:none}
.pk{position:fixed;inset:0;z-index:50;background:rgba(20,13,25,.5);display:grid;place-items:center;padding:16px}
.pkbox{background:var(--bg);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:min(88vh,780px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.pkhead{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}.pkhead input{flex:1;min-width:160px}
.pklist{overflow-y:auto;padding:10px 12px;flex:1;min-height:120px}
.pkrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:6px;cursor:pointer}
.pkrow:hover{border-color:var(--accent)}.pkrow.on{border-color:var(--accent);background:var(--accent-soft)}.pkrow input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.pkclaim{font-weight:600;margin:3px 0 1px}
.pkadd{padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}.pkadd .form.plain{grid-template-columns:repeat(3,minmax(0,1fr))}
.pkfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
@media (max-width:900px){.split{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.form{grid-template-columns:1fr}.qgrid,.qgrid.igrid{grid-template-columns:1fr}.pk{padding:0;place-items:end stretch}.pkbox{border-radius:14px 14px 0 0;max-height:92vh;width:100%}.pkadd .form.plain{grid-template-columns:1fr}.pkfoot .toolbar{width:100%}.pkfoot .btn{flex:1}}
</style>

  const qi=box.querySelector("#pkq");qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=box.querySelector("#pkq");n.focus();n.setSelectionRange(p,p)};
  box.querySelectorAll("[data-id]").forEach(c=>c.onchange=()=>{const id=c.dataset.id;sel=c.checked?[...sel.filter(x=>x!==id),id]:sel.filter(x=>x!==id);render()});
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{sel=sel.filter(x=>x!==b.dataset.rm);render()});
  box.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{const a=b.dataset.pk;
   if(a==="x")close();else if(a==="ok")close(sel.join(", "));else if(a==="mine"||a==="all"){all=a==="all";render()}else if(a==="new"){adding=true;render();box.querySelector("#pkc").focus()}else if(a==="cancel"){adding=false;render()}
   else if(a==="save"){const claim=box.querySelector("#pkc").value.trim();if(!claim){box.querySelector("#pkc").focus();return}const ev=ledgerAll(),o={_id:Math.random().toString(36).slice(2,9),id:nextId(ev,"id","EV"),[P]:pc||"",claim,stype:box.querySelector("#pkt").value,source:box.querySelector("#pks").value.trim(),found:today(),grade:box.querySelector("#pkg").value,ads:"Needs compliance review",use:"Reword",usedIn:""};o.recheck=recheckFor(o);ev.unshift(o);save();sel.push(o.id);adding=false;render()}});
  box.onclick=e=>{if(e.target===box)close()}};
 render();setTimeout(()=>{const i=box.querySelector("#pkq");i&&i.focus()},0)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(b&&!b.disabled){const inp=document.getElementById(b.dataset.pick);if(!inp)return;const text=b.dataset.mode==="text";
  const cur=text?(inp.value.match(/EV-\d+/gi)||[]).join(" "):inp.value;
  pickEv(b.dataset.pc||"",cur,v=>{if(text){const base=inp.value.replace(/\s*\(\s*(EV-\d+[\s,]*)+\)\s*$/i,"").replace(/\bEV-\d+\b[\s,]*/gi,"").trim();inp.value=v?`${base} (${v})`.trim():base}else inp.value=v;inp.dispatchEvent(new Event("input"));inp.dispatchEvent(new Event("change"))});return}
 const f=e.target.closest("[data-fillrc]");if(f){ledgerAll().forEach(x=>{if(x.found&&!x.recheck)x.recheck=recheckFor(x)});save();draw()}});
draw();
})();
