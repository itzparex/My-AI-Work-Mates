<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1240px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blush);font-weight:800}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3vw,32px);line-height:1.1;margin:4px 0 6px;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-size:17px;margin:0 0 10px}
.sub{color:var(--muted);margin:0;max-width:66ch}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.card ul{margin:0;padding-left:18px}.card li{margin:3px 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:inherit;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--accent)}
.kpi .n{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1}.kpi .l{font-weight:700;margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.toolbar input{flex:1;min-width:180px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td a{color:var(--accent);word-break:break-all}
.mono{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{display:inline-flex;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.g{background:var(--good-soft);color:var(--good)}.a{background:var(--accent-soft);color:var(--accent)}.w{background:var(--warn-soft);color:var(--warn)}.b{background:var(--bad-soft);color:var(--bad)}.p{background:var(--blush-soft);color:var(--blush)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.formacts{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}

.check.done span{color:var(--muted);text-decoration:line-through}
.progress{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:6px 0 12px}.progress i{display:block;height:100%;background:var(--accent)}
.note{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px;margin-top:14px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.form.plain{border:0;padding:0;margin:0;background:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.kq{padding:10px 0;border-top:1px solid var(--line)}.kq label{display:flex;gap:10px;font-weight:700;margin-bottom:6px}
.kq textarea,.qgrid textarea,.qgrid input,.qcard input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:11.5px;font-weight:800}
table.mini th{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--muted);padding:6px 8px 6px 0;width:42%}table.mini td{padding:6px 0;font-weight:700}
.mk{padding:10px 0;border-top:1px solid var(--line)}.mk:first-of-type{border-top:0;padding-top:0}
.mk dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:6px 0 0;font-size:12.5px}.mk dt{color:var(--muted);font-weight:700}.mk dd{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:700;cursor:pointer;font-size:12.5px}.seg button.on{background:var(--accent);color:var(--accent-ink)}
.qcard{margin-bottom:10px}.look{margin:6px 0 10px;font-size:12.5px;color:var(--muted)}.look span{font-weight:700;color:var(--ink)}
.qgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
.qgrid [data-bad]{color:var(--warn)}
.unk{display:inline-flex;gap:8px;align-items:center;margin-top:8px;font-size:12.5px;font-weight:700;cursor:pointer}.unk input{accent-color:var(--accent);width:16px;height:16px}
.card a,.note a,.sub a{color:var(--accent)}
a.btn{text-decoration:none;display:inline-block;color:var(--ink);word-break:normal}a.btn.primary{color:var(--accent-ink)}
.evin{display:flex;gap:6px;align-items:center}.evin input{flex:1;min-width:0}
.evchips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.evchips:empty{display:none}
.pk{position:fixed;inset:0;z-index:50;background:rgba(20,13,25,.5);display:grid;place-items:center;padding:16px}
.pkbox{background:var(--bg);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:min(88vh,780px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.pkhead{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}.pkhead input{flex:1;min-width:160px}
.pklist{overflow-y:auto;padding:10px 12px;flex:1;min-height:120px}
.pkrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:6px;cursor:pointer}
.pkrow:hover{border-color:var(--accent)}.pkrow.on{border-color:var(--accent);background:var(--accent-soft)}.pkrow input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.pkclaim{font-weight:600;margin:3px 0 1px}
.pkadd{padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}.pkadd .form.plain{grid-template-columns:repeat(3,minmax(0,1fr))}
.pkfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
@media (max-width:900px){.split{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.form{grid-template-columns:1fr}.qgrid{grid-template-columns:1fr}.pk{padding:0;place-items:end stretch}.pkbox{border-radius:14px 14px 0 0;max-height:92vh;width:100%}.pkadd .form.plain{grid-template-columns:1fr}.pkfoot .toolbar{width:100%}.pkfoot .btn{flex:1}}
</style>

    <div class="field" style="margin-top:10px"><label for="dwhy">Why, in one line</label><input id="dwhy" data-h="confWhy" value="${esc(r.confWhy)}" placeholder="e.g. 60 reviews agree, but no lab test yet" style="background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px"></div></div>
   <p class="note">Quote customers word for word and never invent numbers. Anything the work mate can't reach becomes a <a href="#persontasks">person task</a>; anything that needs a guardrail override goes to the Project Director, who informs the CEO.</p>
  </div></div>`;
  const keep=fn=>{const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;fn();if(id){const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}};
  const later=()=>setTimeout(()=>{if(location.hash.startsWith("#documents/"))keep(render)},0);
  $$("[data-h]").forEach(el=>{el.onchange=()=>{r[el.dataset.h]=el.tagName==="TEXTAREA"?el.value:el.value.trim();save();later()}});
  $$("[data-s]").forEach(el=>{el.onchange=()=>{r.summary[el.dataset.s]=el.value.trim();save();later()}});
  $$("[data-mc]").forEach(el=>{const t=el.dataset.mc,f=el.dataset.f;el.oninput=()=>{(r.mc[t]||(r.mc[t]={}))[f]=el.value;save();if(f==="ev"){const bad=evBad(el.value),sp=[...document.querySelectorAll("[data-bad]")].find(x=>x.dataset.bad===t);if(sp)sp.textContent=bad.length?"Not in the ledger: "+bad.join(", "):"";const ch=el.closest(".field").querySelector("[data-chips]");if(ch)ch.innerHTML=evChips(el.value)}};el.onchange=()=>{if(f==="ev"){r.mc[t].ev=el.value.toUpperCase();save()}later()}});
  $$("[data-c]").forEach(bt=>bt.onclick=()=>{r.conf=r.conf===bt.dataset.c?"":bt.dataset.c;save();render()});
  $$("[data-mk]").forEach(bt=>bt.onclick=()=>{const o={_id:Math.random().toString(36).slice(2,9),[P]:r[P],doc:bt.dataset.mk,status:"Not started",link:"",notes:"",date:today(),version:"1"};rows.push(o);rows.sort((a,b)=>String(a[P]).localeCompare(String(b[P]))||NINE.indexOf(a.doc)-NINE.indexOf(b.doc));save();location.hash="#documents/"+encodeURIComponent(o._id)})};
 render()}
/* Evidence ledger: recheck dates, where each ID is used, grade chips, and the picker used from the documents and the question bank */
const addDays=(n,from)=>{const d=new Date((from||today())+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
function recheckFor(e){if(SHORT.includes(e.stype))return addDays(90,e.found);const d=new Date((e.found||today())+"T00:00:00Z");d.setUTCFullYear(d.getUTCFullYear()+1);return d.toISOString().slice(0,10)}
const ledgerAll=()=>S.rows.evidence||(S.rows.evidence=[]);
const evById=id=>ledgerAll().find(e=>(e.id||"").toUpperCase()===id);
const overdue=e=>!!(e.recheck&&e.recheck<today());
const shortDoc=n=>String(n||"").replace(/^\d\. /,"");
let _um=null;
function usedMap(){if(_um)return _um;const m={},add=(id,l)=>{(m[id]=m[id]||[]).includes(l)||m[id].push(l)};
 Object.entries(S.qa||{}).forEach(([pc,qa])=>Object.entries(qa).forEach(([key,x])=>{if(!x||x.unk)return;const d=+key.split("-")[0];evList(x.ev).forEach(id=>add(id,`${pc} · Question bank, ${shortDoc(NINE[d])}`))}));
 (S.rows.documents||[]).forEach(r=>{const l=`${r[P]?r[P]+" · ":""}${shortDoc(r.doc)}`;(r.summary||[]).forEach(t=>(String(t||"").match(/EV-\d+/gi)||[]).forEach(id=>add(id.toUpperCase(),l+", summary")));Object.entries(r.mc||{}).forEach(([t,v])=>evList(v&&v.ev).forEach(id=>add(id,l+", "+t)))});
 (S.rows.briefs||[]).forEach(b=>Object.values(b.kickEv||{}).forEach(id=>add(String(id).toUpperCase(),`${b[P]?b[P]+" · ":""}Research brief, kickoff`)));
 _um=m;setTimeout(()=>{_um=null},0);return m}
function recheckCell(e){const f=e.found?`<br><span class="mono">found ${esc(e.found)}</span>`:"";if(!e.recheck)return (e.found?`<span class="mono">not set</span>`:'<span class="mono">—</span>')+f;
 return (overdue(e)?`<span class="pill b">Overdue · ${esc(e.recheck)}</span>`:e.recheck<=addDays(14)?`<span class="pill w">Due ${esc(e.recheck)}</span>`:`<span class="mono">${esc(e.recheck)}</span>`)+f}
function usedCell(e){const l=[...(usedMap()[(e.id||"").toUpperCase()]||[]),...((e.usedIn||"").trim()?[e.usedIn.trim()]:[])];
 if(!l.length)return '<span class="mono">Not used yet</span>';return `<span style="font-size:12.5px" title="${esc(l.join("\n"))}">${l.slice(0,2).map(esc).join("<br>")}${l.length>2?`<br><span class="mono">+${l.length-2} more</span>`:""}</span>`}
function ledgerBanner(list){const g=x=>list.filter(e=>(e.grade||"")[0]===x).length,od=list.filter(overdue).length,miss=list.filter(e=>LEDGER_REQ.some(k=>!e[k])).length,dnu=list.filter(e=>e.use==="Do not use").length,um=usedMap();
 const dUsed=list.filter(e=>(e.grade||"")[0]==="D"&&(um[(e.id||"").toUpperCase()]||[]).length).length,noRc=list.filter(e=>e.found&&!e.recheck).length;
 return `<div class="card" style="margin-bottom:14px"><div class="row"><b>${list.length} entr${list.length===1?"y":"ies"} · A ${g("A")} · B ${g("B")} · C ${g("C")} · D ${g("D")}</b><div class="chips">${od?`<button class="chip" data-ff="Recheck overdue" style="color:var(--bad)">${od} past recheck date</button>`:""}${miss?`<button class="chip" data-ff="Missing rulebook fields" style="color:var(--warn)">${miss} missing rulebook fields</button>`:""}${dnu?`<button class="chip" data-ff="Do not use">${dnu} marked Do not use</button>`:""}${noRc?`<button class="chip" data-fillrc>Set ${noRc} recheck date${noRc>1?"s":""}</button>`:""}</div></div>
  <p class="sub" style="font-size:12.5px;margin-top:6px">Grades: only A supports a headline claim; B only as experience ("customers say"); C as color or a quote; D never as a claim, only as a lead to check. Recheck after 90 days for competitor prices, offers and ads, 12 months for everything else, and before any reuse.${dUsed?` <b style="color:var(--warn)">${dUsed} D-grade entr${dUsed===1?"y is":"ies are"} cited in the research: check ${dUsed===1?"it before it backs":"them before they back"} a claim.</b>`:""}</p></div>`}
const gcls=g=>g==="A"||g==="B"?"g":g==="C"?"w":"b";
function evChips(v){return evList(v).map(id=>{const e=evById(id);if(!e)return"";const g=(e.grade||"?")[0],warn=e.use==="Do not use"?" · Do not use":overdue(e)?" · recheck":"";return `<span class="pill ${warn?"b":gcls(g)}" title="${esc((e.claim||"")+(warn?" ("+warn.slice(3)+")":""))}">${esc(id)} · ${esc(g)}${esc(warn)}</span>`}).join("")}
/* picker: opens over the page, search and tick ledger entries (this project first), or add a new entry without leaving */
function pickEv(pc,cur,done){let sel=evList(cur),q="",all=!pc,adding=false;const prev=document.activeElement;
 const box=document.createElement("div");box.className="pk";box.setAttribute("role","dialog");box.setAttribute("aria-modal","true");box.setAttribute("aria-label","Pick ledger IDs");document.body.appendChild(box);
 const close=v=>{box.remove();removeEventListener("keydown",key);if(v!==undefined)done(v);prev&&prev.focus&&prev.focus()};
 const key=e=>{if(e.key==="Escape")close()};addEventListener("keydown",key);
 const render=()=>{const ql=q.toLowerCase(),list=ledgerAll().filter(e=>e.id&&(all||e[P]===pc)&&(!ql||JSON.stringify(e).toLowerCase().includes(ql))).sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
  const missing=sel.filter(id=>!evById(id)),um=usedMap();
  box.innerHTML=`<div class="pkbox"><div class="pkhead"><div class="row"><h2 style="margin:0">Pick ledger IDs</h2><button class="btn sm" data-pk="x" aria-label="Close">✕</button></div>
   <div class="toolbar" style="margin:10px 0 0"><input id="pkq" placeholder="Search claims, sources, IDs" value="${esc(q)}" aria-label="Search the ledger">${pc?`<div class="seg" role="group" aria-label="Which entries"><button class="${all?"":"on"}" data-pk="mine">${esc(pc)}</button><button class="${all?"on":""}" data-pk="all">All projects</button></div>`:""}</div></div>
   <div class="pklist">${missing.length?`<div class="note" style="margin:0 0 8px">Not in the ledger: ${missing.map(id=>`<button class="chip" data-rm="${esc(id)}" title="Remove">${esc(id)} ✕</button>`).join(" ")}</div>`:""}
   ${list.length?list.map(e=>{const id=e.id.toUpperCase(),on=sel.includes(id),g=(e.grade||"?")[0],n=(um[id]||[]).length;return `<label class="pkrow ${on?"on":""}"><input type="checkbox" data-id="${esc(id)}" ${on?"checked":""}><div style="min-width:0;flex:1"><div class="row" style="justify-content:flex-start;gap:6px"><span class="mono" style="color:var(--ink);font-weight:700">${esc(id)}</span>${gradePill(e.grade)}${e.ads?pill(e.ads):""}${e.use==="Do not use"?pill("Do not use"):""}${overdue(e)?`<span class="pill b">Recheck overdue</span>`:""}</div>
    <div class="pkclaim">${esc(e.claim||"(no claim written)")}</div><div class="mono">${esc([e.stype,e.found&&"found "+e.found,!all?"":e[P],n?`used in ${n} place${n>1?"s":""}`:"not used yet"].filter(Boolean).join(" · "))}</div>${g==="D"?`<div class="mono" style="color:var(--warn)">D: a lead to check, never a claim</div>`:g==="C"?`<div class="mono" style="color:var(--warn)">C: color or a quote, not the main claim</div>`:""}</div></label>`}).join(""):`<div class="empty">${ledgerAll().length?"Nothing matches.":"The ledger is empty."} Add an entry below.</div>`}</div>
   ${adding?`<div class="pkadd"><div class="form plain"><div class="field full"><label for="pkc">Claim or finding</label><input id="pkc" placeholder="Buyers say the effect lasts all day"></div><div class="field"><label for="pkt">Source type</label><select id="pkt"><option value="">—</option>${STYPES.map(o=>`<option>${esc(o)}</option>`).join("")}</select></div><div class="field"><label for="pks">Link or location</label><input id="pks" placeholder="https://… or file name"></div><div class="field"><label for="pkg">Grade</label><select id="pkg">${GRADES.map(o=>`<option ${o[0]==="D"?"selected":""}>${esc(o)}</option>`).join("")}</select></div></div></div>`:""}
   <div class="pkfoot"><span class="sub" style="margin:0">${sel.length} selected${sel.length?`: <span class="mono">${esc(sel.join(", "))}</span>`:""}</span><div class="toolbar" style="margin:0">${adding?`<button class="btn" data-pk="cancel">Cancel</button><button class="btn" data-pk="save">Add to ledger</button>`:`<button class="btn" data-pk="new">+ New entry</button>`}<button class="btn primary" data-pk="ok">Use these IDs</button></div></div></div>`;
  const qi=box.querySelector("#pkq");qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=box.querySelector("#pkq");n.focus();n.setSelectionRange(p,p)};
  box.querySelectorAll("[data-id]").forEach(c=>c.onchange=()=>{const id=c.dataset.id;sel=c.checked?[...sel.filter(x=>x!==id),id]:sel.filter(x=>x!==id);render()});
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{sel=sel.filter(x=>x!==b.dataset.rm);render()});
  box.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{const a=b.dataset.pk;
   if(a==="x")close();else if(a==="ok")close(sel.join(", "));else if(a==="mine"||a==="all"){all=a==="all";render()}else if(a==="new"){adding=true;render();box.querySelector("#pkc").focus()}else if(a==="cancel"){adding=false;render()}
   else if(a==="save"){const claim=box.querySelector("#pkc").value.trim();if(!claim){box.querySelector("#pkc").focus();return}const ev=ledgerAll(),o={_id:Math.random().toString(36).slice(2,9),id:nextId(ev,"id","EV"),[P]:pc||"",claim,stype:box.querySelector("#pkt").value,source:box.querySelector("#pks").value.trim(),found:today(),grade:box.querySelector("#pkg").value,ads:"Needs compliance review",use:"Reword",usedIn:""};o.recheck=recheckFor(o);ev.unshift(o);save();sel.push(o.id);adding=false;render()}});
  box.onclick=e=>{if(e.target===box)close()}};
 render();setTimeout(()=>{const i=box.querySelector("#pkq");i&&i.focus()},0)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(b&&!b.disabled){const inp=document.getElementById(b.dataset.pick);if(!inp)return;const text=b.dataset.mode==="text";
  const cur=text?(inp.value.match(/EV-\d+/gi)||[]).join(" "):inp.value;
  pickEv(b.dataset.pc||"",cur,v=>{if(text){const base=inp.value.replace(/\s*\(\s*(EV-\d+[\s,]*)+\)\s*$/i,"").replace(/\bEV-\d+\b[\s,]*/gi,"").trim();inp.value=v?`${base} (${v})`.trim():base}else inp.value=v;inp.dispatchEvent(new Event("input"));inp.dispatchEvent(new Event("change"))});return}
 const f=e.target.closest("[data-fillrc]");if(f){ledgerAll().forEach(x=>{if(x.found&&!x.recheck)x.recheck=recheckFor(x)});save();draw()}});
draw();
})();
</script>
