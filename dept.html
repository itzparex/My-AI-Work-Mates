.pkclaim{font-weight:600;margin:3px 0 1px}
.pkadd{padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}.pkadd .form.plain{grid-template-columns:repeat(3,minmax(0,1fr))}
.pkfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
@media (max-width:900px){.split{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.kpis,.kpis.k6{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.form{grid-template-columns:1fr}.qgrid,.qgrid.igrid{grid-template-columns:1fr}.pk{padding:0;place-items:end stretch}.pkbox{border-radius:14px 14px 0 0;max-height:92vh;width:100%}.pkadd .form.plain{grid-template-columns:1fr}.pkfoot .toolbar{width:100%}.pkfoot .btn{flex:1}}

.sublist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px}

.subrow:first-child{border-top:0}.subrow .sub{font-size:12.5px}
.retrow .retc{display:inline-block;margin-top:4px;font-size:13px;line-height:1.4}
.subact{display:flex;gap:6px;align-items:center}.subact input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--ink);font:inherit;font-size:13px}
.submsg{font-size:12.5px;margin-top:8px}
@media (max-width:760px){.subrow{grid-template-columns:1fr}}
</style>

 const render=()=>{const maps=all.filter(r=>r[P]===pc);if(!maps.some(r=>r._id===mid))mid=maps[0]?maps[0]._id:"";const r=maps.find(x=>x._id===mid);
  const list=r?cmImgList(r):[],ready=list.filter(x=>imgOk(x.m)).length,bare=r?(r.blocks||[]).map((b,i)=>({b,i})).filter(x=>!(x.b.imgs||[]).length):[],h=r&&r.imgHand,stale=h&&(h.version!==r.version||h.count!==list.length);
  $("#main").innerHTML=`<div class="head"><div><div class="eyebrow">${esc(C.name)}</div><h1>Image words & alt text</h1><p class="sub">The exact words that go on each image and the alt text for it, section by section, in page order. Write them in the copy map; this page checks them and gathers the hand-off list for the Graphic Designer.</p></div></div>

   <div class="field" style="min-width:180px"><label for="iwM">Copy map</label><select id="iwM" ${maps.length?"":"disabled"}>${maps.map(x=>`<option value="${esc(x._id)}" ${x._id===mid?"selected":""}>${esc(x.page||"Page")} v${esc(x.version||"1")} · ${esc(x.status||"")}</option>`).join("")||"<option>No copy maps yet</option>"}</select></div></div>
  ${!r?`<div class="card empty">No copy map for this project yet. <a href="#copymaps">Start one in Copy maps</a>, set up its sections, then add each section's images there.</div>`:`
  <div class="kpis" style="margin-bottom:14px"><div class="kpi"><div class="n">${list.length}</div><div class="l">Images</div></div><div class="kpi"><div class="n" style="color:var(--good)">${ready}</div><div class="l">Ready</div></div><div class="kpi"><div class="n" style="${list.length-ready?"color:var(--warn)":""}">${list.length-ready}</div><div class="l">Need work</div></div><div class="kpi"><div class="n">${bare.length}</div><div class="l">Sections without images</div></div></div>

   <div class="toolbar" style="margin:0"><button class="btn primary" id="iwHand" ${list.length&&ready===list.length&&(!h||stale)?"":"disabled"}>Mark ready for the Graphic Designer</button><button class="btn" id="iwCopy" ${list.length?"":"disabled"}>Copy hand-off list as text</button><a class="btn" href="#copymaps/${encodeURIComponent(r._id)}">Edit in the copy map</a></div></div>
  ${list.length?list.map(({b,i,m,j})=>{const f=imgFlags(m);return `<div class="card" style="margin-bottom:10px"><div class="row" style="gap:8px"><div style="display:flex;gap:8px;align-items:center;flex:1;min-width:200px"><span class="num">${i+1}</span><b>${esc(b.sec)}</b><span class="mono">image ${j+1}</span></div>${f.length?`<span class="pill ${f.some(x=>x[0]==="b")?"b":"w"}">${f.length} to fix</span>`:`<span class="pill g">Ready</span>`}</div>
    <p style="margin:6px 0 8px">${esc((m.what||"").trim()||"Not described yet")}</p>

  <p class="note">Alt text describes what a shopper would miss without the image, including any words on it, in plain words and within ${ALT_LIM} characters; leave it empty only for decorative images. Image words are used word for word and follow the same claims rules as the page copy. The Copywriter never publishes or sends anything: this list stays in the app for the Graphic Designer, with the Project Director copied.</p>`;
  $("#iwP").onchange=e=>{pc=e.target.value;mid="";history.replaceState(null,"","#images/"+encodeURIComponent(pc));render()};

 render()}
function recheckFor(e){if(SHORT.includes(e.stype))return addDays(90,e.found);const d=new Date((e.found||today())+"T00:00:00Z");d.setUTCFullYear(d.getUTCFullYear()+1);return d.toISOString().slice(0,10)}

function usedMap(){if(_um)return _um;const m={},add=(id,l)=>{(m[id]=m[id]||[]).includes(l)||m[id].push(l)};
 Object.entries(S.qa||{}).forEach(([pc,qa])=>Object.entries(qa).forEach(([key,x])=>{if(!x||x.unk)return;const d=+key.split("-")[0];evList(x.ev).forEach(id=>add(id,`${pc} · Question bank, ${shortDoc(NINE[d])}`))}));
 (S.rows.documents||[]).forEach(r=>{const l=`${r[P]?r[P]+" · ":""}${shortDoc(r.doc)}`;(r.summary||[]).forEach(t=>(String(t||"").match(/EV-\d+/gi)||[]).forEach(id=>add(id.toUpperCase(),l+", summary")));Object.entries(r.mc||{}).forEach(([t,v])=>evList(v&&v.ev).forEach(id=>add(id,l+", "+t)))});
 (S.rows.briefs||[]).forEach(b=>Object.values(b.kickEv||{}).forEach(id=>add(String(id).toUpperCase(),`${b[P]?b[P]+" · ":""}Research brief, kickoff`)));
 _um=m;setTimeout(()=>{_um=null},0);return m}

function usedCell(e){const l=[...(usedMap()[(e.id||"").toUpperCase()]||[]),...((e.usedIn||"").trim()?[e.usedIn.trim()]:[])];
 if(!l.length)return '<span class="mono">Not used yet</span>';return `<span style="font-size:12.5px" title="${esc(l.join("\n"))}">${l.slice(0,2).map(esc).join("<br>")}${l.length>2?`<br><span class="mono">+${l.length-2} more</span>`:""}</span>`}
function ledgerBanner(list){const g=x=>list.filter(e=>(e.grade||"")[0]===x).length,od=list.filter(overdue).length,miss=list.filter(e=>LEDGER_REQ.some(k=>!e[k])).length,dnu=list.filter(e=>e.use==="Do not use").length,um=usedMap();
 const dUsed=list.filter(e=>(e.grade||"")[0]==="D"&&(um[(e.id||"").toUpperCase()]||[]).length).length,noRc=list.filter(e=>e.found&&!e.recheck).length;
 return `<div class="card" style="margin-bottom:14px"><div class="row"><b>${list.length} entr${list.length===1?"y":"ies"} · A ${g("A")} · B ${g("B")} · C ${g("C")} · D ${g("D")}</b><div class="chips">${od?`<button class="chip" data-ff="Recheck overdue" style="color:var(--bad)">${od} past recheck date</button>`:""}${miss?`<button class="chip" data-ff="Missing rulebook fields" style="color:var(--warn)">${miss} missing rulebook fields</button>`:""}${dnu?`<button class="chip" data-ff="Do not use">${dnu} marked Do not use</button>`:""}${noRc?`<button class="chip" data-fillrc>Set ${noRc} recheck date${noRc>1?"s":""}</button>`:""}</div></div>
  <p class="sub" style="font-size:12.5px;margin-top:6px">Grades: only A supports a headline claim; B only as experience ("customers say"); C as color or a quote; D never as a claim, only as a lead to check. Recheck after 90 days for competitor prices, offers and ads, 12 months for everything else, and before any reuse.${dUsed?` <b style="color:var(--warn)">${dUsed} D-grade entr${dUsed===1?"y is":"ies are"} cited in the research: check ${dUsed===1?"it before it backs":"them before they back"} a claim.</b>`:""}</p></div>`}

/* picker: opens over the page, search and tick ledger entries (this project first), or add a new entry without leaving */
function pickEv(pc,cur,done){let sel=evList(cur),q="",all=!pc,adding=false;const prev=document.activeElement;
 const box=document.createElement("div");box.className="pk";box.setAttribute("role","dialog");box.setAttribute("aria-modal","true");box.setAttribute("aria-label","Pick ledger IDs");document.body.appendChild(box);

  box.innerHTML=`<div class="pkbox"><div class="pkhead"><div class="row"><h2 style="margin:0">Pick ledger IDs</h2><button class="btn sm" data-pk="x" aria-label="Close">✕</button></div>

    <div class="pkclaim">${esc(e.claim||"(no claim written)")}</div><div class="mono">${esc([e.stype,e.found&&"found "+e.found,!all?"":e[P],D!=="research"?"":n?`used in ${n} place${n>1?"s":""}`:"not used yet"].filter(Boolean).join(" · "))}</div>${g==="D"?`<div class="mono" style="color:var(--warn)">D: a lead to check, never a claim</div>`:g==="C"?`<div class="mono" style="color:var(--warn)">C: color or a quote, not the main claim</div>`:""}</div></label>`}).join(""):`<div class="empty">${ledgerAll().length?"Nothing matches.":"The ledger is empty."} ${D==="research"?"Add an entry below.":"New entries come from the Research & Strategist."}</div>`}</div>
   ${adding?`<div class="pkadd"><div class="form plain"><div class="field full"><label for="pkc">Claim or finding</label><input id="pkc" placeholder="Buyers say the effect lasts all day"></div><div class="field"><label for="pkt">Source type</label><select id="pkt"><option value="">—</option>${STYPES.map(o=>`<option>${esc(o)}</option>`).join("")}</select></div><div class="field"><label for="pks">Link or location</label><input id="pks" placeholder="https://… or file name"></div><div class="field"><label for="pkg">Grade</label><select id="pkg">${GRADES.map(o=>`<option ${o[0]==="D"?"selected":""}>${esc(o)}</option>`).join("")}</select></div></div></div>`:""}
   <div class="pkfoot"><span class="sub" style="margin:0">${sel.length} selected${sel.length?`: <span class="mono">${esc(sel.join(", "))}</span>`:""}</span><div class="toolbar" style="margin:0">${adding?`<button class="btn" data-pk="cancel">Cancel</button><button class="btn" data-pk="save">Add to ledger</button>`:(D==="research"?`<button class="btn" data-pk="new">+ New entry</button>`:"")}<button class="btn primary" data-pk="ok">Use these IDs</button></div></div></div>`;
  const qi=box.querySelector("#pkq");qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=box.querySelector("#pkq");n.focus();n.setSelectionRange(p,p)};
  box.querySelectorAll("[data-id]").forEach(c=>c.onchange=()=>{const id=c.dataset.id;sel=c.checked?[...sel.filter(x=>x!==id),id]:sel.filter(x=>x!==id);render()});

   if(a==="x")close();else if(a==="ok")close(sel.join(", "));else if(a==="mine"||a==="all"){all=a==="all";render()}else if(a==="new"){adding=true;render();box.querySelector("#pkc").focus()}else if(a==="cancel"){adding=false;render()}

  box.onclick=e=>{if(e.target===box)close()}};
 render();setTimeout(()=>{const i=box.querySelector("#pkq");i&&i.focus()},0)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(b&&!b.disabled){const inp=document.getElementById(b.dataset.pick);if(!inp)return;const text=b.dataset.mode==="text";
