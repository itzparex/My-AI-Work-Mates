<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agency HQ · My AI Work Mates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
.embed .top,.embed body::before{display:none}.embed main{padding-top:16px}
/* Layout: two separate dashboards (CEO, Project Director) behind one switcher; CEO = decisions first, Director = timeline first */
:root{
  --bg:#f8f5fa;--surface:#fff;--sunk:#f1ecf5;--line:#e6ddec;--ink:#24152b;--muted:#6e6178;
  --accent:#6a35e8;--accent-ink:#fff;--accent-soft:#efe8ff;--blush:#ff7aa2;--blush-soft:#ffe8ef;
  --good:#15845b;--good-soft:#dff5ea;--warn:#a86300;--warn-soft:#fff1d6;--bad:#c2334d;--bad-soft:#fde7eb;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-body:"Manrope","Segoe UI",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px;--shadow:0 1px 2px rgba(36,21,43,.06),0 8px 24px rgba(36,21,43,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d19;--surface:#1d1424;--sunk:#251a2e;--line:#352841;--ink:#f3ecf7;--muted:#a798b2;--accent:#9b74ff;--accent-ink:#140d19;--accent-soft:#2c2045;--blush:#ff8fb1;--blush-soft:#3a1f2b;--good:#4fd39a;--good-soft:#163428;--warn:#f2b54b;--warn-soft:#382a12;--bad:#ff7b92;--bad-soft:#3a1820;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#140d19;--surface:#1d1424;--sunk:#251a2e;--line:#352841;--ink:#f3ecf7;--muted:#a798b2;--accent:#9b74ff;--accent-ink:#140d19;--accent-soft:#2c2045;--blush:#ff8fb1;--blush-soft:#3a1f2b;--good:#4fd39a;--good-soft:#163428;--warn:#f2b54b;--warn-soft:#382a12;--bad:#ff7b92;--bad-soft:#3a1820;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--blush));display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800}
.brand b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.1}.brand small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{max-width:1280px;margin:0 auto;padding-block:22px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blush);font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3vw,34px);line-height:1.1;margin:4px 0 6px;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0}
.sub{color:var(--muted);margin:0;max-width:64ch}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.good{color:var(--good);border-color:var(--good)}.btn.bad{color:var(--bad);border-color:var(--bad)}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.p-done{background:var(--good-soft);color:var(--good)}.p-prog{background:var(--accent-soft);color:var(--accent)}.p-wait{background:var(--warn-soft);color:var(--warn)}.p-block{background:var(--bad-soft);color:var(--bad)}.p-person{background:var(--blush-soft);color:var(--blush)}
.grid{display:grid;gap:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>h2{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .n{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-weight:700;margin-top:4px}.kpi .d{color:var(--muted);font-size:12px}
.decision{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.decision.override{border-left-color:var(--blush)}.decision.escalation{border-left-color:var(--bad)}
.decision .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.decision p{margin:0}.rec{font-size:13px;color:var(--muted)}.rec b{color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.proj{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--surface);text-align:left}
.proj:hover{border-color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12px}
.mono{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.deps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.dept{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
a.dept:hover{border-color:var(--accent)}
.dept.off{opacity:.55}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}
/* gantt */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.g-row{display:grid;grid-template-columns:230px 1fr;min-width:880px;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-label{padding:8px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.g-label b{font-size:13px}
.g-track{position:relative;min-height:52px;background:repeating-linear-gradient(90deg,transparent 0 calc(var(--day) - 1px),var(--line) calc(var(--day) - 1px) var(--day))}
.g-head .g-track{min-height:30px;background:none}
.g-tick{position:absolute;top:8px;font-size:11px;color:var(--muted);transform:translateX(4px);white-space:nowrap}
.g-bar{position:absolute;top:14px;height:24px;border-radius:7px;display:flex;align-items:center;padding:0 8px;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;border:1.5px solid}
.g-bar.s-done{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.g-bar.s-prog{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.g-bar.s-wait{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.g-bar.s-block{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.g-bar.s-person{background:var(--blush-soft);color:var(--blush);border-color:var(--blush)}
.g-bar.s-not{background:var(--surface);color:var(--muted);border-color:var(--line);border-style:dashed}
.g-bar.short{overflow:visible}.g-bar.short span{position:absolute;left:calc(100% + 6px);color:var(--muted);font-weight:600}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--blush);z-index:1}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:currentColor}
.wl{display:grid;grid-template-columns:150px 1fr 30px;gap:10px;align-items:center;font-size:13px}
.wl .bar i{background:var(--blush)}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.field.wide{grid-column:span 2}.field.full{grid-column:1/-1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.modalwrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(20,10,25,.5)}
.modal{background:var(--surface);border-radius:16px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.note{font-size:12.5px;background:var(--sunk);border-radius:10px;padding:10px 12px;color:var(--muted)}
.example{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60}
.empty{padding:24px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:10px}
.inline-input{display:flex;gap:6px;margin-top:6px}.inline-input input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px}
/* CEO command center */
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:24px 24px 18px;margin-bottom:16px;background:radial-gradient(120% 140% at 100% 0%,var(--blush-soft) 0%,transparent 45%),radial-gradient(90% 120% at 0% 100%,var(--accent-soft) 0%,transparent 55%),var(--surface);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blush));opacity:.09;pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
.hello{font-size:clamp(30px,4.4vw,48px);letter-spacing:-.025em;margin:6px 0 10px;line-height:1.02}
.status{margin:0;font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.status .dot{color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink)}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-warn::before{background:var(--warn)}.st-bad::before{background:var(--bad)}.st-good::before{background:var(--good)}
a.st:hover{text-decoration:underline;text-underline-offset:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;position:relative;z-index:1}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--surface) 72%,transparent);border:1px solid var(--line);text-decoration:none;color:inherit;backdrop-filter:blur(6px)}
a.stat:hover{border-color:var(--accent)}
.stat .n{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat .n small{font-size:15px;color:var(--muted);font-weight:700}
.stat .l{font-size:12px;font-weight:700;color:var(--muted)}
.t-bad{color:var(--bad)!important}.t-good{color:var(--good)!important}
.hint{margin:-6px 0 12px;font-size:12.5px;color:var(--muted)}
.card>h2 .more{margin-left:auto;font-family:var(--f-body);font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none}
.proj{color:inherit;font:inherit;width:100%}
.proj.risk{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));box-shadow:inset 3px 0 0 var(--bad)}
.pbar{display:flex;align-items:center;gap:10px}.pbar .bar{flex:1}.pbar b{font-family:var(--f-display);font-size:15px;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.pfacts{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.pfacts>div{display:flex;flex-direction:column;gap:1px;min-width:0;font-weight:600}
.k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.riskline{font-size:12.5px;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:6px 10px}
.mates{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.mate{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:var(--surface);transition:border-color .15s,transform .15s}
.mate:hover{border-color:var(--accent);transform:translateY(-1px)}
.mate .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:14px;flex:none}
.mate b{font-size:13.5px;line-height:1.25}
.mstate{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;align-self:flex-start;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.mstate i{width:7px;height:7px;border-radius:50%;background:currentColor}
.m-prog{background:var(--accent-soft);color:var(--accent)}.m-prog i{animation:pulse 1.6s ease-in-out infinite}
.m-wait{background:var(--warn-soft);color:var(--warn)}.m-person{background:var(--blush-soft);color:var(--blush)}.m-bad{background:var(--bad-soft);color:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.mtask{min-height:36px;line-height:1.4}
.mfoot{display:flex;flex-direction:column;gap:1px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:7px;margin-top:auto}
.cols-b{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.claude{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 60%)}
.cmark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--blush));color:#fff;font-size:14px}
.cl-row{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px solid var(--line)}
.usage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:4px 0 14px;border-bottom:1px solid var(--line)}
.ring{--p:0;--c:var(--accent);width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-family:var(--f-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}.ring b small{font-size:13px;color:var(--muted)}
.ring span{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.ring.blank b{color:var(--muted)}
.ufacts{display:flex;flex-direction:column;gap:4px;min-width:0}
.ufacts .big{font-weight:800;font-size:15px}
.stale{color:var(--warn);font-weight:700}
.uform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.uform .acts{grid-column:1/-1;justify-content:flex-end}
.uform .quickp{grid-column:1/-1}
.spark{display:flex;align-items:flex-end;gap:3px;height:22px;margin-top:2px}.spark i{width:6px;border-radius:2px;background:var(--accent);opacity:.55;min-height:2px}.spark i:last-child{opacity:1}
.spark i.a{background:var(--blush)}.src{font-weight:600;color:var(--ink)}.src.auto{color:var(--accent)}
.reader{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;margin:12px 0 4px;border-radius:10px;background:var(--sunk);line-height:1.45}.reader>span:nth-child(2){flex:1 1 260px;min-width:0}.rdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;opacity:.6}.rdot.on{background:var(--good);opacity:1}
a.btn{text-decoration:none;color:inherit}
@media (max-width:640px){.usage{gap:12px}.ring{width:80px;height:80px}.ring>div{width:62px;height:62px}.ring b{font-size:20px}.uform{grid-template-columns:1fr}}
.runrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0}
.runrow .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--accent);font-size:14px}
.rinfo{display:flex;flex-direction:column;gap:2px;min-width:0}.rinfo .row{gap:6px}
.rhist{margin-top:6px}.rhist summary{cursor:pointer;font-size:12px;font-weight:800;color:var(--accent)}
.rh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}.rh:last-child{border-bottom:0}
.toks{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0}.tk{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px}.tk b{font-variant-numeric:tabular-nums}
.cl-row a{color:var(--accent)}
@media (max-width:640px){.rh{grid-template-columns:auto minmax(0,1fr)}.rh>.mono{grid-column:2}}
.lgroup{margin-top:12px}.lgroup .k{display:block;margin-bottom:6px}.lgroup .links{margin-top:0}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.links a{font-size:12px;font-weight:700;text-decoration:none;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 10px}
.links a:hover{border-color:var(--accent)}
.ilist{display:flex;flex-direction:column}
.iss{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.iss:last-child{border-bottom:0}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.wkn{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}
.wkn .n{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}.wkn .l{font-size:12px;font-weight:700;color:var(--muted)}
.wkcols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.wkcols .k{margin-bottom:6px}
.wkitem{display:flex;gap:10px;padding:5px 0;font-size:13px;font-weight:600}

(function(){

const nextWork=s=>{let d=D(s);do{d.setUTCDate(d.getUTCDate()+1)}while([0,6].includes(d.getUTCDay()));return iso(d)};

const STUDIO="index.html#/uiux/studio";
const ICO={"Project Director":"◎","Research & Strategist":"⌕","Copywriter":"✎","UI/UX Designer":"◧","Graphic Designer":"▣","Shopify Developer":"⟨⟩"};
const DEPTS=[["Research & Strategist","index.html#/research/overview"],["Copywriter","index.html#/copy/overview"],["UI/UX Designer",STUDIO],["Graphic Designer","index.html#/graphic/overview"],["Shopify Developer","index.html#/shopify/overview"]];

const PCLS={"Done":"p-done","In progress":"p-prog","Waiting on approval":"p-wait","Waiting on a person":"p-person","Blocked":"p-block"};
/* nine steps with working-day estimates [quick, full] */

function planTasks(code,start,depth){let cur=start,prevStart=start,tasks=[];STEPS.forEach((st,i)=>{const n=depth==="Quick"?st[2]:st[3];const s=st[4]==="parallel"?prevStart:cur;const e=addWork(s,n);tasks.push({id:code+"-"+String(i+1).padStart(2,"0"),name:st[0],dept:st[1],start:s,due:e,status:"Not started",gate:st[4]==="gate"});if(st[4]!=="parallel"){prevStart=s;cur=nextWork(e)}else{const later=tasks[i-1].due>e?tasks[i-1].due:e;cur=nextWork(later)}});return tasks}
function seed(){
 const p1={code:"FL-PDP",name:"Facelove product page",client:"Facelove",product:"Everlove mascara",goal:"Raise add-to-cart rate from 6% to 9%",markets:["US","UK"],depth:"Full",start:"2026-10-20",priority:"High",status:"Active",example:true,tasks:planTasks("FL-PDP","2026-10-20","Full")};
 const st=["Done","Done","Done","In progress","Waiting on a person","Not started","Not started","Not started","Not started","Not started"];p1.tasks.forEach((t,i)=>t.status=st[i]);
 p1.due=p1.tasks.at(-1).due;
 const p2={code:"FL-COL",name:"Everlove collection page",client:"Facelove",product:"Everlove range",goal:"Lift collection-to-product clicks by 20%",markets:["US"],depth:"Quick",start:"2026-11-09",priority:"Normal",status:"Planning",example:true,tasks:planTasks("FL-COL","2026-11-09","Quick")};p2.due=p2.tasks.at(-1).due;
 return {projects:[p1,p2],sel:"FL-PDP",
  decisions:[
   {id:uid(),type:"Approval",project:"FL-PDP",title:"Approve the launch offer",detail:"Offer Research recommends: 1 tube full price, 2 tubes save 15%, 3 tubes save 25%, 30-day guarantee. Margin stays above target on all three.",rec:"Approve. Test 2-for-15% against the current single-tube offer.",example:true},
   {id:uid(),type:"Override",project:"FL-PDP",title:"AI product image for the new Brown Black shade",detail:"No real photos exist yet for the new shade, so carousel slide 1 is blocked. Graphic Designer can make an AI product image matched to the supplier spec.",rec:"Allow for slide 1 only, until real photos arrive.",example:true},
   {id:uid(),type:"Escalation",project:"FL-PDP",title:"Client wants \"clinically proven\" in the headline",detail:"Evidence ledger has only grade C support (one supplier test without a published method). Claims check marked it Do not use.",rec:"Disallow. Use \"customers say\" wording backed by 120+ reviews (grade B).",example:true}],
  issues:[{id:"IS-001",date:"2026-10-29",project:"FL-PDP",dept:"Research & Strategist",what:"Amazon reviews couldn't be read automatically",type:"Tool or access",sev:"Low",told:"Person task created (30 reviews per competitor)",decision:"—",status:"Resolved",example:true},{id:"IS-002",date:"2026-11-02",project:"FL-PDP",dept:"Graphic Designer",what:"No product photos for the new shade",type:"Blocked",sev:"High",told:"Options: wait for photos, or a CEO-approved AI product image",decision:"Waiting on CEO",status:"Waiting on CEO",example:true}],
  lessons:[{id:"LL-001",date:"2026-10-30",project:"FL-PDP",dept:"Research & Strategist",what:"Competitor ad research took 2 extra days without the browser agent",type:"Process gap",change:"Run the Ad Library step through the browser agent first",example:true}],

if(!S||!S.projects){S=seed();if(DM){DM.writeHq(S);S=readS()||S}}
if(!Array.isArray(S.decided))S.decided=[];
let UI;try{UI=JSON.parse(localStorage.getItem(KEY+"-ui")||"null")}catch(e){UI=null}if(!UI)UI={theme:"system"};
const save=()=>{if(DM){const err=DM.writeHq(S);if(err)toast(err);return}toast("Not saved: the shared data couldn't load on this device")};
/* every decision the CEO made, newest first: from the model's decided history (plus older ones read from the issues log) */
const decidedAll=()=>DM&&DM.load()?DM.decided():(S.decided||[]).slice().sort((a,b)=>(b.date||"")<(a.date||"")?-1:1);
/* new work from another page (a department logging an issue or asking for a decision) reaches the model; show it here

addEventListener("storage",e=>{if(!DM||e.key!==DM.KEY)return;const x=readS();if(!x||!x.projects)return;S=x;if(!Array.isArray(S.decided))S.decided=[];
 const busy=$("#modalRoot").innerHTML||document.querySelector(".inline-input")||($("#uForm")&&$("#uForm").innerHTML)||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));if(!busy)draw()});

$("#themesw").onclick=e=>{const b=e.target.closest("button");if(!b)return;UI.theme=b.dataset.t;saveUI();applyTheme()};

const prog=p=>{const n=p.tasks.length,d=p.tasks.filter(t=>t.status==="Done").length;return {n,d,pct:n?Math.round(d/n*100):0}};

/* CEO command center: greeting and status, decisions, project health, work mates, Claude panel, open issues, this week */
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
function riskOf(p){if(p.status==="Closed"||p.status==="Launched")return null;
 const open=p.tasks.filter(t=>t.status!=="Done");
 const late=open.filter(t=>t.due<TODAY);if(late.length)return late[0].name+" is "+plural(days(late[0].due,TODAY),"day")+" late";
 const bl=open.find(t=>t.status==="Blocked");if(bl)return bl.name+" is blocked";
 const hi=S.issues.find(i=>i.project===p.code&&i.sev==="High"&&i.status!=="Resolved");if(hi)return "High issue: "+hi.what;
 return null}
function mateState(n){const ts=S.projects.filter(p=>p.status!=="Closed").flatMap(p=>p.tasks.map(t=>({...t,project:p.code}))).filter(t=>t.dept===n&&t.status!=="Done");
 const pick=st=>ts.find(t=>t.status===st);
 const order=[["Blocked","Blocked","bad"],["Waiting on a person","Needs a person","person"],["Waiting on approval","In review","wait"],["In progress","Working","prog"]];
 for(const [st,label,cls] of order){const t=pick(st);if(t)return {label,cls,task:t}}
 const next=ts.filter(t=>t.status==="Not started").sort((a,b)=>a.start<b.start?-1:1)[0];
 return {label:"Idle",cls:"idle",task:null,next}}
function weekBounds(){const d=D(TODAY),w=(d.getUTCDay()+6)%7;const s=new Date(d);s.setUTCDate(d.getUTCDate()-w);const e=new Date(s);e.setUTCDate(s.getUTCDate()+6);return [iso(s),iso(e)]}
/* Claude panel: plan usage is noted by the CEO (Claude has no usage feed for apps), always with the time it was noted */
const DOC=id=>"https://claude.ai/artifact/"+id;
const LINKS=[["Claude",[["Usage page","https://claude.ai/settings/usage"],["Scheduled tasks","https://claude.ai/code"]]],
 ["Rulebooks",[["Product brief",DOC("YTuDLcyoaVpKuywSddfqbo")],["Project Director",DOC("YH9YbXXmmt3Ao15JNPgkzq")],["Research & Strategist",DOC("NqSeg4uwA49BV4JhZd8X8Z")],["Copywriter",DOC("V8r1tStkg3uDkpdzcVF489")],["UI/UX Designer",DOC("LrwprikVGXu4yXpEmkh1HF")],["Graphic Designer",DOC("XjeF4sWgPd5rxTz5VD8PvJ")],["Shopify Developer",DOC("DLH5vsgeZ3Wow6nmZiwp28")]]],
 ["Build",[["GitHub repo","https://github.com/itzparex/My-AI-Work-Mates"],["Build backlog","https://github.com/itzparex/My-AI-Work-Mates/blob/main/LOOP.md"],["Releases","https://github.com/itzparex/My-AI-Work-Mates/releases"]]]];
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);if(m<1)return "just now";if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<24)return plural(h,"hour")+" ago";return plural(Math.round(h/24),"day")+" ago"};
const until=t=>{const m=Math.round((new Date(t)-Date.now())/6e4);if(m<60)return "in "+Math.max(m,0)+" min";const h=Math.round(m/60);if(h<48)return "in "+plural(h,"hour");return "in "+plural(Math.round(h/24),"day")};
const when=t=>new Date(t).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const localDT=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"T"+z(d.getHours())+":"+z(d.getMinutes())};
/* C2c: an optional "Usage reader" scheduled task on the CEO's computer reads the usage page and saves readings in runs/usage.json
   (agents/usage-reader.md). The panel shows whichever reading is newest and says how it got there. */
const USAGE_REMOTE="https://raw.githubusercontent.com/itzparex/My-AI-Work-Mates/main/runs/usage.json";
const READER_DOC="https://github.com/itzparex/My-AI-Work-Mates/blob/main/agents/usage-reader.md";
const READER_PROMPT='You are the optional "Usage reader" for My AI Work Mates (repo itzparex/My-AI-Work-Mates). Follow agents/usage-reader.md in that repo exactly.';
let AUTO=null;try{AUTO=JSON.parse(localStorage.getItem(KEY+"-usage")||"null")}catch(e){}
async function loadUsage(){const get=u=>fetch(u,{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null);
 const [a,b]=await Promise.all([get("runs/usage.json"),get(USAGE_REMOTE)]);
 const ok=[a,b].filter(x=>x&&Array.isArray(x.readings)).sort((x,y)=>(y.updated||"")>(x.updated||"")?1:-1)[0];
 if(ok){AUTO=ok;try{localStorage.setItem(KEY+"-usage",JSON.stringify(AUTO))}catch(e){}}
 const box=$("#usageBox");if(box&&!($("#uForm")||{}).innerHTML){box.innerHTML=usageHTML();$("#uEdit")&&($("#uEdit").onclick=usageForm);wireReader()}}

 return `<div class="reader small"><span class="rdot ${a?"on":""}" aria-hidden="true"></span><span>${a?`Automatic reading: last read <b>${ago(a.at)}</b>${a.note?` <span class="muted">· ${esc(a.note)}</span>`:""}`:`<b>Automatic reading is off</b> <span class="muted">(optional)</span>. When your computer and the Claude desktop app are on, a scheduled task can read your usage page and save the number here.`}</span>
  <span class="row"><button class="btn sm" id="rdCopy" type="button">Copy task prompt</button><a class="btn sm" href="${READER_DOC}" target="_blank" rel="noopener">${a?"How it works":"How to set up"} ↗</a></span></div>`}
function wireReader(){const b=$("#rdCopy");if(b)b.onclick=()=>{const done=()=>toast("Prompt copied. Paste it into a new scheduled task in the Claude desktop app");
 (navigator.clipboard?navigator.clipboard.writeText(READER_PROMPT):Promise.reject()).then(done).catch(()=>{const t=document.createElement("textarea");t.value=READER_PROMPT;document.body.appendChild(t);t.select();try{document.execCommand("copy");done()}catch(e){toast("Copy failed. Open How to set up instead")}t.remove()})}}
function usageHTML(){const C=S.claude||{},man=C.usage,auto=autoLast();
 const u=man&&auto?(new Date(auto.at)>new Date(man.at)?auto:man):man||auto;
 const hist=[...(C.history||[]).map(h=>({...h,src:"CEO"})),...((AUTO&&AUTO.readings)||[]).map(h=>({pct:h.pct,at:h.at,src:"auto"}))].sort((a,b)=>a.at<b.at?-1:1).slice(-12);
 if(!u)return `<div class="usage"><div class="ring blank" style="--p:0"><div><b>—</b><span>used</span></div></div><div class="ufacts"><span class="big">Plan usage not noted yet</span><span class="small muted">Claude doesn't share a usage number with apps. Open the usage page, then note the percentage here in one tap.</span><div class="row" style="margin-top:4px"><button class="btn sm primary" id="uEdit">Note usage</button></div></div></div><div id="uForm"></div>${readerHTML()}`;
 const isAuto=u.source==="auto";
 const pct=Math.max(0,Math.min(100,+u.pct||0)),col=pct>=90?"var(--bad)":pct>=70?"var(--warn)":"var(--accent)";
 const passed=u.reset&&new Date(u.reset)<Date.now(),stale=Date.now()-new Date(u.at)>24*36e5;
 return `<div class="usage"><div class="ring" style="--p:${pct};--c:${col}" role="img" aria-label="${pct}% of plan used"><div><div><b>${pct}<small>%</small></b><br><span>used</span></div></div></div>
  <div class="ufacts"><span class="big">${pct>=90?"Almost at the plan limit":pct>=70?"Getting close to the limit":"Plenty of room left"}</span>
   <span class="small">${u.reset?(passed?`<span class="stale">Reset time passed (${esc(when(u.reset))}); usage has likely restarted. Note the new number.</span>`:`Resets <b>${esc(when(u.reset))}</b> · ${until(u.reset)}`):'<span class="muted">Reset time not noted</span>'}</span>
   <span class="small ${stale?"stale":"muted"}">Last updated ${ago(u.at)} · <span class="src ${isAuto?"auto":""}">${isAuto?"read automatically":"noted by "+esc(u.by||"CEO")}</span>${isAuto&&u.note?" · "+esc(u.note):""}</span>

   <div class="row" style="margin-top:2px"><button class="btn sm primary" id="uEdit">Update</button><a class="btn sm" href="https://claude.ai/settings/usage" target="_blank" rel="noopener">Open usage page ↗</a></div></div></div><div id="uForm"></div>${readerHTML()}`}
function usageForm(){const box=$("#uForm");if(!box)return;if(box.innerHTML){box.innerHTML="";return}
 const u=(S.claude||{}).usage||{},def=u.reset&&new Date(u.reset)>Date.now()?localDT(new Date(u.reset)):"";
 box.innerHTML=`<div class="uform"><div class="field"><label for="u-pct">Percent used</label><input id="u-pct" type="number" min="0" max="100" inputmode="numeric" value="${u.pct??""}" placeholder="e.g. 42"></div>
  <div class="field"><label for="u-reset">Resets at</label><input id="u-reset" type="datetime-local" value="${def}"></div>
  <div class="quickp chips" aria-label="Quick reset">${[["in 1 h",1],["in 3 h",3],["in 5 h",5],["in 1 day",24],["in 7 days",168]].map(([l,h])=>`<button type="button" class="chip" data-h="${h}">Resets ${l}</button>`).join("")}</div>
  <div class="acts"><button class="btn sm" id="u-cancel">Cancel</button><button class="btn sm primary" id="u-save">Save</button></div></div>`;
 box.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{$("#u-reset").value=localDT(new Date(Date.now()+b.dataset.h*36e5))});
 $("#u-cancel").onclick=()=>box.innerHTML="";
 const go=()=>{const v=$("#u-pct").value.trim(),pct=Math.round(+v);if(v===""||isNaN(pct)||pct<0||pct>100){toast("Enter a percentage from 0 to 100");$("#u-pct").focus();return}
  const r=$("#u-reset").value,at=new Date().toISOString();S.claude=S.claude||{};
  S.claude.usage={pct,reset:r?new Date(r).toISOString():null,at,by:"CEO",source:"manual"};

  ${byKind.length?`<div class="row small" style="flex-wrap:wrap;gap:6px;margin-top:8px"><span class="k" style="margin-right:4px">Deliverables</span>${byKind.map(([k,n])=>`<span class="pill">${n} ${esc(k)}</span>`).join("")}</div>`:""}
 </section>
 <div class="cols cols-b" style="margin-top:16px">
  <section class="card"><h2>Checks <span class="pill ${bad?"p-block":warn?"p-wait":"p-done"}">${bad?bad+" problem"+(bad>1?"s":""):warn?warn+" to look at":"All clear"}</span></h2>
   <div>${chk.map(([l,t])=>`<div class="dchk"><span class="ic ${l==="bad"?"t-bad":l==="ok"?"t-good":""}" style="${l==="warn"?"color:var(--warn)":""}" aria-label="${l==="bad"?"Problem":l==="warn"?"Look at":"Fine"}">${l==="bad"?"✕":l==="warn"?"!":"✓"}</span><span>${esc(t)}</span></div>`).join("")}</div>
   <p class="hint" style="margin:10px 0 0">Problems here never change your data. The Project Director logs anything that needs fixing in the issues log.</p></section>
  <section class="card"><h2>Where it's saved <span class="pill ${ret?"p-done":"p-wait"}">${ret?"Model only":"Not retired yet"}</span></h2>
   <p class="hint" style="margin:0 0 8px">Each page's part now lives in the shared model (<span class="mono">${esc(DM.KEY)}</span>). Its old key stays beside it as a read-only backup${ret?`, kept since ${esc(ago(ret.at))} and never written again`:""}.</p>
   <div class="tablewrap"><table class="dsrc"><thead><tr><th>Page</th><th>Holds</th><th>In the model</th><th>Old key (read-only backup)</th></tr></thead><tbody>${DM.SOURCES.map(([k,who,what])=>{const s=m&&m.meta.sources[k]||{},b=s.backup||{},ch=ret&&DM.sig(DM.raw(k))!==(ret.sigs||{})[k];return `<tr><td><b>${esc(who)}</b></td><td>${esc(what)}</td><td>${s.found?kb(s.bytes):'<span class="muted">Nothing saved yet</span>'}</td><td><div class="mono small muted">${esc(k)}</div>${b.unreadable?'<span class="pill p-block">Unreadable</span>':b.found?`${kb(b.bytes)} · ${ch?'<span class="pill p-wait">Changed: taken in on next open</span>':'<span class="pill p-done">Untouched</span>'}`:'<span class="muted">None</span>'}</td></tr>`}).join("")}</tbody></table></div>
   <div class="lgroup"><span class="k">Backup of the old data</span><div class="small">${bk?`Kept ${esc(ago(bk.at))} · ${bk.keys.length} part${bk.keys.length===1?"":"s"} · ${kb(bk.bytes)} · <span class="mono">${esc(DM.BACKUP)}</span>`:'<span class="t-bad">No backup yet</span> (nothing saved, or not enough storage)'}</div></div>
   <div class="lgroup"><span class="k">Log</span><div class="dlog">${(m&&m.meta.log||[]).slice(0,8).map(([at,t])=>`<div><span class="mono">${esc(ago(at))}</span><span>${esc(t)}</span></div>`).join("")||'<div class="muted">Nothing yet.</div>'}</div></div></section>
 </div>
 <section class="card" style="margin-top:16px"><h2>The model</h2><p class="hint">The six collections every page shares. The project code links them all.</p>
  <div class="dschema">${cols.map(c=>{const d=DM.SCHEMA[c];return `<details><summary>${esc(d.label)}</summary><p>${esc(d.what)}</p><ul>${d.fields.map(([f,w])=>`<li><span class="mono">${esc(f)}</span> · ${esc(w)}</li>`).join("")}</ul></details>`}).join("")}</div>
 </section>`;
 $("#dmRebuild").onclick=()=>{DM.migrate("manual");toast("Shared model rebuilt");drawData()};
}
function decide(d,result){S.decisions=S.decisions.filter(x=>x!==d);
 const open=d.issue?S.issues.find(i=>i.id===d.issue):S.issues.find(i=>i.project===d.project&&i.status==="Waiting on CEO");
 if(d.ai)aiAnswer(d,result);
 let logged;
 if(open&&d.type!=="Approval"){open.decision=result+" ("+fmt(TODAY)+")";open.status="Resolved";logged=open.id}
 else{logged=nextIssueId();S.issues.unshift({id:logged,date:TODAY,project:d.project,dept:"CEO decision",what:d.title,type:d.type==="Override"?"Override request":d.type,sev:"Medium",told:d.rec,decision:result,status:"Resolved"})}
 /* decided history in the shared model: the decision as it was put to the CEO, with the answer and date */
 S.decided=[Object.assign({},d,{result,date:TODAY,by:"CEO",issue:logged}),...(S.decided||[])];
 save();toast(result.split(":")[0]+" · recorded in the issues log");drawCEO()}
/* AI product image approvals (1c-iii): the CEO's answer is written back on the department's request with the date */
function aiAnswer(d,result){if(!DM)return;const k="mawm-dept-"+(d.ai.dept||"graphic");try{const G=DM.page(k),row=G&&G.rows&&(G.rows.aiimages||[]).find(x=>x._id===d.ai.row);if(!row)return;
 const note=result.includes(": ")?result.split(": ").slice(1).join(": "):"";row.decision=/^Allowed/.test(result)?"Approved":"Rejected";row.date=TODAY;row.note=note==="no note"?"":note;row.by="CEO";const err=DM.saveDept(k,G);if(err)toast(err)}catch(e){}}
const nextIssueId=()=>{const n=S.issues.reduce((m,i)=>{const k=+String(i.id||"").replace(/^IS-/,"");return isNaN(k)?m:Math.max(m,k)},0);return "IS-"+String(n+1).padStart(3,"0")};
function issuesTable(list){return list.length?`<div class="tablewrap"><table><thead><tr><th>ID</th><th>Date</th><th>Project</th><th>Department</th><th>What happened</th><th>Severity</th><th>CEO decision</th><th>Status</th></tr></thead><tbody>${list.map(i=>`<tr><td class="mono">${esc(i.id)}</td><td>${fmt(i.date)}</td><td class="mono">${esc(i.project)}</td><td>${esc(i.dept)}</td><td>${esc(i.what)}${i.example?' <span class="example">Example</span>':""}</td><td><span class="pill ${i.sev==="High"?"p-block":i.sev==="Medium"?"p-wait":""}">${esc(i.sev)}</span></td><td>${esc(i.decision)}</td><td><span class="pill ${i.status==="Resolved"?"p-done":"p-wait"}">${esc(i.status)}</span></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">No open issues.</div>'}
function openCreate(){let mk=new Set(["US"]);
 $("#modalRoot").innerHTML=`<div class="modalwrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="cpT"><div><div class="eyebrow">New project</div><h2 id="cpT" style="font-size:22px">Create a project</h2><p class="sub small">The Project Director builds the nine-step timeline from these answers using the standard task times. You can adjust dates afterwards.</p></div>
 <div class="form">
  <div class="field"><label for="cp-code">Project code</label><input id="cp-code" placeholder="FL-LP"></div>
  <div class="field wide"><label for="cp-name">Project name</label><input id="cp-name" placeholder="Holiday landing page"></div>
  <div class="field"><label for="cp-pri">Priority</label><select id="cp-pri"><option>High</option><option selected>Normal</option><option>Low</option></select></div>
  <div class="field"><label for="cp-client">Client</label><input id="cp-client" placeholder="Facelove"></div>
  <div class="field"><label for="cp-prod">Product</label><input id="cp-prod" placeholder="Everlove mascara"></div>
  <div class="field wide"><label for="cp-goal">Goal and success number</label><input id="cp-goal" placeholder="Raise conversion rate from 2.1% to 3%"></div>
  <div class="field wide"><span class="lbl">Markets</span><div class="chips" id="cp-mk">${["US","UK","EU","Canada","Australia"].map(m=>`<button type="button" class="chip ${mk.has(m)?"on":""}" data-m="${m}">${m}</button>`).join("")}</div></div>
  <div class="field"><label for="cp-depth">Research depth</label><select id="cp-depth"><option>Full</option><option>Quick</option></select></div>
  <div class="field"><label for="cp-start">Start date</label><input type="date" id="cp-start" value="${nextWork(TODAY)}"></div>
 </div>
 <div class="note" id="cp-preview"></div>
 <div class="acts" style="justify-content:flex-end"><button class="btn" id="cp-cancel">Cancel</button><button class="btn primary" id="cp-save">Create and send to Project Director</button></div></div></div>`;
 const pv=()=>{const t=planTasks("X",$("#cp-start").value||nextWork(TODAY),$("#cp-depth").value);$("#cp-preview").innerHTML=`Planned launch: <b>${fmt(t.at(-1).due)}</b> · ${t.length} tasks · ${$("#cp-depth").value} research. Status starts as Planning until you agree the plan.`};pv();
 ["#cp-start","#cp-depth"].forEach(s=>$(s).onchange=pv);
 $("#cp-mk").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;mk.has(b.dataset.m)?mk.delete(b.dataset.m):mk.add(b.dataset.m);b.classList.toggle("on")};
 $("#cp-cancel").onclick=()=>$("#modalRoot").innerHTML="";
 $("#cp-save").onclick=()=>{const code=($("#cp-code").value.trim()||"P-"+uid()).toUpperCase(),name=$("#cp-name").value.trim();if(!name){toast("Give the project a name");$("#cp-name").focus();return}if(proj(code)){toast("That project code is already used");return}
  const start=$("#cp-start").value||nextWork(TODAY),depth=$("#cp-depth").value,tasks=planTasks(code,start,depth);
  S.projects.unshift({code,name,client:$("#cp-client").value.trim()||"—",product:$("#cp-prod").value.trim(),goal:$("#cp-goal").value.trim(),markets:[...mk],depth,start,due:tasks.at(-1).due,priority:$("#cp-pri").value,status:"Planning",tasks});
  S.decisions.unshift({id:uid(),type:"Approval",project:code,title:"Agree the project plan for "+name,detail:`${tasks.length} tasks from ${fmt(start)} to ${fmt(tasks.at(-1).due)}, ${depth} research, markets ${[...mk].join(", ")}.`,rec:"Agree the plan so research can start."});
  S.sel=code;save();$("#modalRoot").innerHTML="";toast("Project created · plan sent for your approval");drawCEO()};
 $("#cp-name").focus()}

/* ================= PROJECT DIRECTOR ================= */
function drawDirector(){
 if(!proj(S.sel))S.sel=S.projects[0]&&S.projects[0].code;const p=proj(S.sel);
 const waitRev=S.projects.flatMap(x=>x.tasks.map(t=>({...t,project:x.code}))).filter(t=>t.status==="Waiting on approval");
 $("#main").innerHTML=`
 <div class="head"><div><div class="eyebrow">Project Director dashboard</div><h1>${p?esc(p.name):"No projects yet"}</h1><p class="sub">${p?`${esc(p.goal||"")} · ${esc(p.markets.join(", "))} · ${esc(p.depth)} research · launch due ${fmt(p.due)}`:"Projects the CEO creates appear here."}</p></div>
  <div class="field" style="min-width:240px"><label for="pd-proj">Project</label><select id="pd-proj">${S.projects.map(x=>`<option value="${x.code}" ${x.code===S.sel?"selected":""}>${esc(x.code)} · ${esc(x.name)}</option>`).join("")}</select></div></div>
 ${p?`<section class="card" data-sec="timeline"><h2>Timeline <span class="pill">${prog(p).d}/${prog(p).n} done</span>${p.example?'<span class="example">Example</span>':""}</h2>${gantt(p)}
  <div class="legend"><span style="color:var(--good)">Done</span><span style="color:var(--accent)">In progress</span><span style="color:var(--warn)">Waiting on approval</span><span style="color:var(--blush)">Waiting on a person</span><span style="color:var(--bad)">Blocked</span><span style="color:var(--muted)">Not started</span></div></section>
 <section class="card" data-sec="tasks" style="margin-top:16px"><h2>Tasks</h2><div class="tablewrap"><table><thead><tr><th>Task</th><th>Department</th><th>Start</th><th>Due</th><th>Status</th></tr></thead><tbody>${p.tasks.map((t,i)=>`<tr><td><span class="mono">${esc(t.id)}</span><br><b>${esc(t.name)}</b>${t.gate?' <span class="pill p-wait">Approval</span>':""}</td><td>${esc(t.dept)}</td><td><input type="date" value="${t.start}" data-ti="${i}" data-f="start" aria-label="Start date" style="border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface)"></td><td><input type="date" value="${t.due}" data-ti="${i}" data-f="due" aria-label="Due date" style="border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface)"></td><td><select data-ti="${i}" data-f="status" aria-label="Status" style="border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface)">${STATUSES.map(s=>`<option ${s===t.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div></section>`:""}
 <div class="cols" style="margin-top:16px">
  <section class="card" data-sec="review"><h2>Review queue <span class="pill">${waitRev.length}</span></h2>${waitRev.length?`<div class="grid">${waitRev.map(t=>`<div class="decision" data-proj="${t.project}" data-tid="${t.id}"><div class="meta"><span class="mono">${esc(t.project)} · ${esc(t.id)}</span><span class="pill">${esc(t.dept)}</span></div><b>${esc(t.name)}</b><span class="small muted">Check it against the department checklist and run the spot-checks before approving.</span><div class="acts"><button class="btn sm good" data-rv="ok">Approve</button><button class="btn sm bad" data-rv="back">Return with comments</button><button class="btn sm" data-rv="ceo">Send to CEO</button></div></div>`).join("")}</div>`:'<div class="empty">Nothing waiting for review. Set a task to "Waiting on approval" to queue it here.</div>'}</section>
  <section class="card" data-sec="workload"><h2>Department workload</h2><div class="grid">${DEPTS.map(([n])=>{const c=S.projects.flatMap(x=>x.tasks).filter(t=>t.dept===n&&t.status!=="Done"&&t.status!=="Not started").length,q=S.projects.flatMap(x=>x.tasks).filter(t=>t.dept===n&&t.status==="Not started").length;return `<div class="wl"><span>${esc(n)}</span><div class="bar"><i style="width:${Math.min(100,c*34)}%"></i></div><span class="small muted" title="${q} queued">${c}</span></div>`}).join("")}<span class="small muted">Bars show active tasks; queued tasks are on each project's timeline.</span></div></section>
 </div>
 <section class="card" data-sec="issues" style="margin-top:16px"><h2>Issues log <button class="btn sm" id="addIssue" style="margin-left:auto">+ Log issue</button></h2>${issuesTable(S.issues)}</section>
 <section class="card" data-sec="lessons" style="margin-top:16px"><h2>Lessons log <button class="btn sm" id="addLesson" style="margin-left:auto">+ Add lesson</button></h2>${S.lessons.length?`<div class="tablewrap"><table><thead><tr><th>ID</th><th>Date</th><th>Department</th><th>What happened</th><th>Type</th><th>Change for next time</th></tr></thead><tbody>${S.lessons.map(l=>`<tr><td class="mono">${esc(l.id)}</td><td>${fmt(l.date)}</td><td>${esc(l.dept)}</td><td>${esc(l.what)}${l.example?' <span class="example">Example</span>':""}</td><td>${esc(l.type)}</td><td>${esc(l.change)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">No lessons yet.</div>'}</section>`;
 $("#pd-proj").onchange=e=>{S.sel=e.target.value;save();drawDirector()};
 $$("[data-ti]").forEach(el=>el.onchange=()=>{const t=p.tasks[+el.dataset.ti];t[el.dataset.f]=el.value;if(el.dataset.f==="status")t.doneAt=el.value==="Done"?TODAY:undefined;if(el.dataset.f==="due"&&t.due<t.start)t.start=t.due;p.due=p.tasks.reduce((m,x)=>x.due>m?x.due:m,p.tasks[0].due);if(p.tasks.every(x=>x.status==="Done"))p.status="Launched";else if(p.status!=="Planning")p.status="Active";save();toast("Timeline updated");drawDirector()});
 $$("[data-rv]").forEach(b=>b.onclick=()=>{const card=b.closest("[data-tid]"),pr=proj(card.dataset.proj),t=pr.tasks.find(x=>x.id===card.dataset.tid);
  if(b.dataset.rv==="ok"){t.status="Done";t.doneAt=TODAY;save();toast("Approved");drawDirector()}
  else if(b.dataset.rv==="ceo"){S.decisions.unshift({id:uid(),type:"Escalation",project:pr.code,title:"Review needed: "+t.name,detail:"Sent up by the Project Director from the review queue.",rec:"See the deliverable before deciding."});save();toast("Sent to the CEO");}
  else if(!card.querySelector(".inline-input")){card.insertAdjacentHTML("beforeend",`<div class="inline-input"><input placeholder="What must change, field by field" aria-label="Return comment"><button class="btn sm bad">Return</button></div>`);const box=card.querySelector(".inline-input");box.querySelector("input").focus();box.querySelector("button").onclick=()=>{t.status="In progress";S.issues.unshift({id:nextIssueId(),date:TODAY,project:pr.code,dept:t.dept,what:"Returned: "+t.name+" — "+(box.querySelector("input").value||"see comments"),type:"Error",sev:"Low",told:"—",decision:"—",status:"Open"});save();toast("Returned and logged");drawDirector()}}});
 $("#addIssue").onclick=()=>quickAdd("issue");$("#addLesson").onclick=()=>quickAdd("lesson");
}
function gantt(p){const s0=p.tasks.reduce((m,t)=>t.start<m?t.start:m,p.tasks[0].start),e0=p.tasks.reduce((m,t)=>t.due>m?t.due:m,p.tasks[0].due);const total=days(s0,e0)+1;
 const pct=d=>days(s0,d)/total*100,w=(a,b)=>(days(a,b)+1)/total*100;const ticks=[];for(let i=0;i<total;i+=Math.max(1,Math.ceil(total/10))){const d=new Date(D(s0));d.setUTCDate(d.getUTCDate()+i);ticks.push(iso(d))}
 const today=TODAY>=s0&&TODAY<=e0?`<div class="g-today" style="left:${pct(TODAY)}%" title="Today"></div>`:"";
 return `<div class="gantt" style="--day:calc(100% / ${total})"><div class="g-row g-head"><div class="g-label"><b>Task</b></div><div class="g-track">${ticks.map(d=>`<span class="g-tick" style="left:${pct(d)}%">${fmt(d)}</span>`).join("")}${today}</div></div>${p.tasks.map(t=>`<div class="g-row"><div class="g-label"><b>${esc(t.name)}</b><span class="small muted">${esc(t.dept)}</span></div><div class="g-track">${today}<div class="g-bar s-${SCLS[t.status]||"not"} ${days(t.start,t.due)<4?"short":""}" style="left:${pct(t.start)}%;width:${w(t.start,t.due)}%" title="${esc(t.name)}: ${fmt(t.start)} to ${fmt(t.due)}, ${esc(t.status)}"><span>${t.start===t.due?fmt(t.start):fmt(t.start)+" – "+fmt(t.due)}</span></div></div></div>`).join("")}</div>`}
function quickAdd(kind){const p=proj(S.sel);const isI=kind==="issue";
 $("#modalRoot").innerHTML=`<div class="modalwrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="qaT"><h2 id="qaT" style="font-size:20px">${isI?"Log an issue":"Add a lesson"}</h2><div class="form">
  <div class="field"><label for="qa-dept">Department</label><select id="qa-dept">${DEPTS.map(([n])=>`<option>${n}</option>`).join("")}<option>Project Director</option></select></div>
  <div class="field"><label for="qa-type">Type</label><select id="qa-type">${(isI?["Blocked","Error","Rule hit","Override request","Tool or access","Delay","Repeated return"]:["Mistake","Win","Process gap"]).map(x=>`<option>${x}</option>`).join("")}</select></div>
  ${isI?`<div class="field"><label for="qa-sev">Severity</label><select id="qa-sev"><option>Low</option><option>Medium</option><option>High</option></select></div>`:""}
  <div class="field full"><label for="qa-what">What happened</label><input id="qa-what"></div>
  <div class="field full"><label for="qa-more">${isI?"What to tell the CEO (options and recommendation)":"Change for next time"}</label><input id="qa-more"></div></div>
  ${isI?'<div class="note">High severity also creates a decision on the CEO dashboard.</div>':""}
  <div class="acts" style="justify-content:flex-end"><button class="btn" id="qa-c">Cancel</button><button class="btn primary" id="qa-s">Save</button></div></div></div>`;
 $("#qa-c").onclick=()=>$("#modalRoot").innerHTML="";
 $("#qa-s").onclick=()=>{const what=$("#qa-what").value.trim();if(!what){toast("Describe what happened");return}
  if(isI){const sev=$("#qa-sev").value,more=$("#qa-more").value.trim();S.issues.unshift({id:nextIssueId(),date:TODAY,project:p?p.code:"—",dept:$("#qa-dept").value,what,type:$("#qa-type").value,sev,told:more||"—",decision:sev==="High"?"Waiting on CEO":"—",status:sev==="High"?"Waiting on CEO":"Open"});if(sev==="High")S.decisions.unshift({id:uid(),type:$("#qa-type").value==="Override request"?"Override":"Escalation",project:p?p.code:"—",title:what,detail:"Logged by the Project Director as high severity.",rec:more||"See the issues log."})}
  else S.lessons.unshift({id:"LL-"+String(S.lessons.length+1).padStart(3,"0"),date:TODAY,project:p?p.code:"—",dept:$("#qa-dept").value,what,type:$("#qa-type").value,change:$("#qa-more").value.trim()||"—"});
  save();$("#modalRoot").innerHTML="";toast("Saved");drawDirector()};
 $("#qa-what").focus()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modalRoot").innerHTML=""});
applyTheme();draw();loadRuns();loadUsage();
})();
</script>
